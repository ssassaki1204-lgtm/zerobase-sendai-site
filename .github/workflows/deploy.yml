# main の site/ が変わったら、Firebase Hosting（https://zero-base-sendai.web.app）に自動で公開する
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZERO_BASE_SENDAI }}
          projectId: zero-base-sendai
          channelId: live
          entryPoint: site
